# Continuous integration (milestone M0): the jobs below run the commands documented in
# docs/DEVELOPMENT.md ("Running the tests"), with the few differences noted next to them.
# CI only builds and tests. Publishing images and deploying arrive in milestone M4.
#
# Supply-chain rules for this file:
#   * every third-party action is pinned to a full 40-character commit SHA, with the release it
#     belongs to in a trailing comment (Dependabot keeps both up to date);
#   * the token may only read the repository (no job needs more) and no job uses a secret;
#   * Python, Rust, Node and tool versions are pinned exactly, like everywhere else in the project.
name: CI

# Pushes are built only on master; every other branch is built through its pull request, so a
# branch with an open pull request is not tested twice (once for the push, once for the pull request).
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch (or pull request) cancels the run that is still going, except on
# master, where every run is kept to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python:
    name: Python (engine, deploy scripts, tools)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            engine/pyproject.toml
            engine/constraints.txt

      # requirements-dev.txt holds no pins of its own: it installs the engine with its [dev] extra
      # under engine/constraints.txt, which pins the whole dependency tree, so CI installs exactly
      # the versions the Docker image gets.
      - name: Install dependencies (locked)
        run: python -m pip install -r requirements-dev.txt

      - name: Tests (engine, deploy scripts and compose rules, tools)
        run: python -m pytest engine/tests deploy/tests tools/tests -q

      # Audits the locked set (the engine's runtime and dev dependency tree) and not the runner's
      # environment: an environment audit also reports the pip bundled with the runner's Python,
      # which is not part of this project and changes with the runner image.
      - name: Audit locked Python dependencies
        run: python -m pip_audit -r engine/constraints.txt --no-deps --disable-pip --progress-spinner off

      # Legacy routing regression guard: root-level code, no database or LLM, no extra packages.
      - name: Legacy routing tests (test_multiturn.py)
        env:
          PYTHONIOENCODING: utf-8
        run: python test_multiturn.py

  rust:
    name: Rust (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup reads the pinned channel and components (rustfmt, clippy) from web/rust-toolchain.toml.
      - name: Install the toolchain pinned in web/rust-toolchain.toml
        run: |
          rustup toolchain install --profile minimal
          rustc --version
          cargo --version

      # Caches the cargo registry and web/target. Its key includes the hash of rust-toolchain.toml
      # and Cargo.lock, so a toolchain or dependency change starts a fresh cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: web

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      # The tests read ../contracts and the build embeds ../db/migrations; the full checkout has both.
      - name: Tests
        run: cargo test --locked

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2

      - name: Audit Cargo.lock
        run: cargo audit

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [public, admin]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type and Svelte check
        run: npm run check

      - name: Build and tests
        run: npm run test:build

      # Full tree, not --omit=dev: every package in both apps is a devDependency (Svelte and
      # SvelteKit runtime code is bundled into what browsers download), so --omit=dev audits nothing.
      - name: Audit dependencies (full tree)
        run: npm audit --audit-level=high

  stack:
    name: Stack (compose build, smoke, exposure, integration tests)
    needs: [python, rust, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The deploy scripts are standard-library Python; this makes sure `python` is 3.12.10.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      # Random throw-away secrets for this run only. Never print .env.
      - name: Create .env
        run: python deploy/make_env.py

      # --profile tools also builds the one-off release image (gsn-release:dev), which a plain build skips.
      - name: Build the images
        run: docker compose --profile tools build

      - name: Start the stack
        run: docker compose up -d

      - name: Smoke test (waits up to 300 s for /readyz)
        run: python deploy/smoke.py --url http://localhost/readyz --timeout 300

      # Unlike DEVELOPMENT.md, 8081 is not listed: the runner is the stack's own host, where the
      # admin port is deliberately published on loopback (127.0.0.1:8081).
      - name: Exposure check (only Caddy on port 80 is reachable)
        run: python deploy/check_exposure.py --host localhost --expect-open 80 --expect-closed 5432,8000,8080

      - name: Integration tests (against the running stack)
        run: docker compose -f compose.yaml -f compose.test.yaml run --rm itest

      # Builds a release of this very commit with the fake embedder (no 2 GB model in CI), publishes it
      # and lists releases: proves the release image, the read-only repository mount, the secret-path
      # scan and the database functions work together. The fake embedder makes the gold queries fail,
      # hence --override. The itest step above ran first on this fresh database, so the release id is
      # not 1: it is read from the first line of the build output. -T: no pseudo-terminal in CI.
      - name: Release smoke (fake embedder)
        run: |
          set -euo pipefail
          release() { docker compose --profile tools run --rm -T -e GSN_EMBEDDER=fake release release "$@"; }
          release build --commit HEAD --override "CI smoke test (fake embedder)" | tee build.log
          id=$(sed -n 's/^release_id=\([0-9]*\) .*/\1/p' build.log)
          test -n "$id" || { echo "no release id in the first line of the build output"; exit 1; }
          release publish "$id" --allow-fake
          release list

      - name: Container state and logs (only when something failed)
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Tear down (containers and volumes)
        if: always()
        run: docker compose down -v
