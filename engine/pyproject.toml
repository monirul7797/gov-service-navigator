[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "gsn"
version = "0.1.0"
description = "Government Service Navigator: engine app, worker and CLI"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.156.7",
    "starlette==1.9.0",
    "uvicorn==0.54.0",
    "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx2==2.16.0",
    "pyyaml==6.0.3",
    "pip-audit==2.10.1",
]
# Installed only in the one-off release image (Dockerfile target `release`), never on the host. The
# pins are the versions the ChromaDB baseline was made with (docs/reports/m1-parity/chroma_baseline.json),
# so that vectors from the image can be compared with the baseline's. `torch` comes from the PyTorch CPU
# index (`+cpu`: no CUDA libraries). The whole ML tree is locked in constraints-ml.txt, generated in a
# Linux container (docs/DEVELOPMENT.md "ML constraints").
ml = [
    "sentence-transformers==5.6.0",
    "torch==2.13.0+cpu",
    "transformers==5.13.1",
    "tokenizers==0.22.2",
    "safetensors==0.8.0",
    "numpy==2.5.1",
    "huggingface-hub==1.23.0",
]

[project.scripts]
gsn = "gsn.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import test modules by file path instead of by bare module name, so two folders may hold a test file
# of the same name (engine/tests/test_store.py and tests/integration/test_store.py already do). This file
# is the one pytest finds for `python -m pytest engine/tests deploy/tests tools/tests`, so the option
# applies to all three folders; deploy/tests/test_repo_hygiene.py guards it.
addopts = ["--import-mode=importlib"]
