[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "gsn"
version = "0.1.0"
description = "Government Service Navigator: engine app, worker and CLI"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.156.7",
    "starlette==1.9.0",
    "uvicorn==0.54.0",
    "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx2==2.16.0",
    "pyyaml==6.0.3",
    "pip-audit==2.10.1",
]

[project.scripts]
gsn = "gsn.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import test modules by file path instead of by bare module name, so two folders may hold a test file
# of the same name (engine/tests/test_store.py and tests/integration/test_store.py already do). This file
# is the one pytest finds for `python -m pytest engine/tests deploy/tests tools/tests`, so the option
# applies to all three folders; deploy/tests/test_repo_hygiene.py guards it.
addopts = ["--import-mode=importlib"]
