[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "gsn"
version = "0.1.0"
description = "Government Service Navigator: engine app, worker and CLI"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.156.7",
    "uvicorn==0.54.0",
    "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "pip-audit==2.10.1",
]

[project.scripts]
gsn = "gsn.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
